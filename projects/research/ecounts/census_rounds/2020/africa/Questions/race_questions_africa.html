<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Race Questions by Country</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222;max-width:720px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 4px} p.sub{margin:0 0 20px;color:#555}
select{font-size:15px;padding:5px;min-width:240px} h2{font-size:19px;margin:24px 0 4px}
dl{margin:0 0 16px} dt{font-weight:bold;float:left;width:110px;clear:left} dd{margin:0 0 3px 110px}
.q{font-size:17px;margin:16px 0} table{border-collapse:collapse;margin:0 0 16px;width:100%}
th,td{border:1px solid #999;padding:5px 10px;text-align:left;font-size:14px;vertical-align:top}
th{background:#eee}.note{color:#555;margin:0 0 10px;white-space:pre-wrap}
.none{color:#a33}.yes{color:#176b2c}.na{color:#8a5a00}hr{border:0;border-top:1px solid #ccc;margin:24px 0}</style></head><body>
<p><a href="../index.html">&larr; Back to 2020 Africa Round</a></p>
<h1>Race Questions by Country</h1>
<p class="sub">Africa &mdash; countries provided so far</p>
<label for="c">Country: </label><select id="c"></select>
<div id="out"></div><hr><p class="note" id="tally"></p>
<script id="data" type="application/json">[{"country": "Zimbabwe", "status": "Yes", "year": "2022", "form": "Private Household Questionnaire", "code": "B18", "source": "Zimbabwe_2022_questionnaire__EN.pdf", "question": "What is (name)\u2019s ethnic origin/ race?", "responses": [["1", "African"], ["2", "Caucasian"], ["3", "Asiatic"], ["4", "Mixed race"], ["9", "Other (Specify)"]], "interpretations": [["1", "African"], ["2", "Caucasian"], ["3", "Asiatic"], ["4", "Mixed race"], ["9", "Other (Specify)"]], "followups": [], "skip": "", "notes": "B18 explicitly includes the term \u201crace\u201d in the question \u201cWhat is (name)\u2019s ethnic origin/ race?\u201d The response categories are African, Caucasian, Asiatic, Mixed race, and Other (Specify). The question combines ethnic origin and race; it is counted here because race is explicitly named.", "source_links": [{"label": "Zimbabwe_2022_questionnaire__EN.pdf", "href": "../Zimbabwe/Zimbabwe_2022_questionnaire__EN.pdf"}]}]</script>
<script>
var data=JSON.parse(document.getElementById('data').textContent);
var sel=document.getElementById('c'),out=document.getElementById('out'),tally=document.getElementById('tally');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tbl(l,interp){
 var h='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';
 l.forEach(function(r,i){var en=(interp&&interp[i])?interp[i][1]:'';h+='<tr><td>'+esc(r[1])+'</td><td>'+esc(en)+'</td></tr>';});
 return h+'</table>';
}
function render(i){
 var d=data[i],h='',cls=d.status==='Yes'?'yes':(d.status==='No'?'none':'na');
 h+='<h2>'+esc(d.country)+'</h2><dl><dt>Status</dt><dd class="'+cls+'"><strong>'+esc(d.status)+'</strong></dd>';
 h+='<dt>Year</dt><dd>'+esc(d.year)+'</dd><dt>Form</dt><dd>'+esc(d.form)+'</dd>';
 if(d.code)h+='<dt>Question</dt><dd>'+esc(d.code)+'</dd>';
 h+='</dl><div class="q">'+esc(d.question)+'</div>';
 if(d.responses.length)h+=tbl(d.responses,d.interpretations);
 if(d.followups.length){h+='<p><strong>Follow-ups:</strong></p><ul>';d.followups.forEach(function(r){h+='<li><strong>'+esc(r[0])+':</strong> '+esc(r[1])+'</li>';});h+='</ul>';}
 if(d.skip)h+='<p><strong>Skip:</strong> '+esc(d.skip)+'</p>';
 if(d.notes)h+='<p class="note"><strong>Notes:</strong> '+esc(d.notes)+'</p>';
 h+='<p class="note"><strong>Source:</strong> '+esc(d.verification)+'</p>';
 if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}out.innerHTML=h;
}
data.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=d.country;sel.appendChild(o);});
sel.addEventListener('change',function(){render(+this.value);});
var yes=data.filter(function(d){return d.status==='Yes';}).length;
var no=data.filter(function(d){return d.status==='No';}).length;
var na=data.filter(function(d){return d.status==='Not assessed';}).length;
tally.textContent=yes+' of '+data.length+' countries explicitly use race/racial terminology in a question; '+no+' do not have an explicit race/racial term identified in the supplied source reviewed; '+na+' are not assessed because a source document was not available in the current conversation.';
render(0);
</script>
</body></html>
