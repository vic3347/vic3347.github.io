<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tribal Questions by Country</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222;max-width:720px;margin:0 auto;padding:24px}
h1{font-size:22px;margin:0 0 4px} p.sub{margin:0 0 20px;color:#555}
select{font-size:15px;padding:5px;min-width:240px} h2{font-size:19px;margin:24px 0 4px}
dl{margin:0 0 16px} dt{font-weight:bold;float:left;width:110px;clear:left} dd{margin:0 0 3px 110px}
.q{font-size:17px;margin:16px 0} table{border-collapse:collapse;margin:0 0 16px;width:100%}
th,td{border:1px solid #999;padding:5px 10px;text-align:left;font-size:14px;vertical-align:top}
th{background:#eee}.note{color:#555;margin:0 0 10px;white-space:pre-wrap}
.none{color:#a33}.yes{color:#176b2c}.na{color:#8a5a00}hr{border:0;border-top:1px solid #ccc;margin:24px 0}</style></head><body>
<p><a href="../index.html">&larr; Back to 2020 Africa Round</a></p>
<h1>Tribal Questions by Country</h1>
<p class="sub">Africa &mdash; countries provided so far</p>
<label for="c">Country: </label><select id="c"></select>
<div id="out"></div><hr><p class="note" id="tally"></p>
<script id="data" type="application/json">[{"status": "Yes", "year": "2008", "form": "Nomad household census form", "code": "Household identification field", "source": "Algeria_2008_nomads_fr.pdf", "question": "Nom de la tribu (arch, quabila)", "responses": [], "interpretations": [], "followups": [], "skip": "", "notes": "The supplied nomad household form explicitly includes the field \u201cNom de la tribu (arch, quabila)\u201d (Name of the tribe). This is a household-level tribal-affiliation field rather than an individual person-level question. Note: this specific 2008 nomad household form file was not found among the files currently stored in this repository's Algeria folder (which contains Algeria_2022_household_fr.pdf); no local source link is provided to avoid linking to a nonexistent file.", "country": "Algeria", "source_links": []}, {"status": "Yes", "year": "2018", "form": "2018 Population and Housing Census Questionnaire", "code": "Q10 / P10", "source": "Malawi_2018_enumeration_form_IPUMS_EN.pdf", "question": "What is [NAME]\u2019s tribe?", "responses": [["01", "CHEWA"], ["02", "TUMBUKA"], ["03", "LOMWE"], ["04", "TONGA"], ["05", "YAO"], ["06", "SENA"], ["07", "NKHONDE"], ["08", "NGONI"], ["09", "LAMBYA"], ["10", "SUKWA"], ["11", "MANG'ANJA"], ["12", "NYANJA"], ["13", "OTHER"]], "interpretations": [["01", "Chewa"], ["02", "Tumbuka"], ["03", "Lomwe"], ["04", "Tonga"], ["05", "Yao"], ["06", "Sena"], ["07", "Nkhonde"], ["08", "Ngoni"], ["09", "Lambya"], ["10", "Sukwa"], ["11", "Mang'anja"], ["12", "Nyanja"], ["13", "Other"]], "followups": [], "skip": "", "notes": "The household questionnaire explicitly asks, \u201cWhat is [NAME]\u2019s tribe?\u201d and provides a coded list of tribes. This is a direct individual-level tribe question.", "country": "Malawi", "source_links": [{"label": "Malawi_2018_enumeration_form_IPUMS_EN.pdf", "href": "../Malawi/Malawi_2018_enumeration_form_IPUMS_EN.pdf"}]}, {"status": "Yes", "year": "2024", "form": "National Population and Housing Census 2024 Household Questionnaire", "code": "P9", "source": "Uganda_Household_2024_EN.pdf", "question": "What is (NAME'S) tribe or nationality?", "responses": [["Ugandan", "Write the tribe code."], ["Non-Ugandan", "Record the country code."]], "interpretations": [["Ugandan", "Record the person's tribe code."], ["Non-Ugandan", "Record the country code."]], "followups": [["P10", "What is (NAME'S) clan?"]], "skip": "NON-UGANDAN, SKIP to P12", "notes": "The questionnaire explicitly asks for the person's \u201ctribe or nationality.\u201d For Ugandans, the instruction is to write the tribe code; for non-Ugandans, the country code is recorded. The separate clan question is not treated as a tribe question.", "country": "Uganda", "source_links": [{"label": "Uganda_Household_2024_EN.pdf", "href": "../Uganda/Uganda_Household_2024_EN.pdf"}]}]</script><script>
var data=JSON.parse(document.getElementById('data').textContent);
var sel=document.getElementById('c'),out=document.getElementById('out'),tally=document.getElementById('tally');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tbl(l,interp){
 var h='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';
 l.forEach(function(r,i){var en=(interp&&interp[i])?interp[i][1]:'';h+='<tr><td>'+esc(r[1])+'</td><td>'+esc(en)+'</td></tr>';});
 return h+'</table>';
}
function render(i){
 var d=data[i],h='',cls=d.status==='Yes'?'yes':(d.status==='No'?'none':'na');
 h+='<h2>'+esc(d.country)+'</h2><dl><dt>Status</dt><dd class="'+cls+'"><strong>'+esc(d.status)+'</strong></dd>';
 h+='<dt>Year</dt><dd>'+esc(d.year)+'</dd><dt>Form</dt><dd>'+esc(d.form)+'</dd>';
 if(d.code)h+='<dt>Question</dt><dd>'+esc(d.code)+'</dd></dl>';
 else h+='</dl>';
 h+='<div class="q">'+esc(d.question)+'</div>';
 if(d.responses.length)h+=tbl(d.responses,d.interpretations);
 if(d.followups.length){h+='<p><strong>Follow-ups:</strong></p><ul>';d.followups.forEach(function(r){h+='<li><strong>'+esc(r[0])+':</strong> '+esc(r[1])+'</li>';});h+='</ul>';}
 if(d.skip)h+='<p><strong>Skip:</strong> '+esc(d.skip)+'</p>';
 if(d.notes)h+='<p class="note"><strong>Notes:</strong> '+esc(d.notes)+'</p>';
 h+='<p class="note"><strong>Source:</strong> '+esc(d.verification)+'</p>';
 if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}
 out.innerHTML=h;
}
data.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=d.country;sel.appendChild(o);});
sel.addEventListener('change',function(){render(+this.value);});
var yes=data.filter(function(d){return d.status==='Yes';}).length;
var no=data.filter(function(d){return d.status==='No';}).length;
var na=data.filter(function(d){return d.status==='Not assessed';}).length;
tally.textContent=yes+' of '+data.length+' countries explicitly use tribe/tribal affiliation in a question or field; '+no+' do not have an explicit tribe/tribal-affiliation term identified in the supplied source reviewed; '+na+' are not assessed.';
render(0);
</script>
</body></html>
