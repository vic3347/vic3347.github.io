<script>
var data=JSON.parse(document.getElementById('data').textContent);
var sel=document.getElementById('c'),out=document.getElementById('out'),tally=document.getElementById('tally');

function tbl(l,interp){var h='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';
l.forEach(function(r,i){var en=(interp&&interp[i])?interp[i][1]:'';h+='<tr><td>'+esc(r[1])+'</td><td>'+esc(en)+'</td></tr>';});return h+'</table>';}
function render(i){var d=data[i],h='',cls=d.status==='Yes'?'yes':(d.status==='No'?'none':'na');

data.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=d.country;sel.appendChild(o);});
sel.addEventListener('change',function(){render(+this.value);});
var yes=data.filter(function(d){return d.status==='Yes';}).length;
var no=data.filter(function(d){return d.status==='No';}).length;
var na=data.filter(function(d){return d.status==='Not assessed';}).length;

render(0);
</script>
