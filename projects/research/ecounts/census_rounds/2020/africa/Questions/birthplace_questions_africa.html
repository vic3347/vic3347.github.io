 var DATA;
 try { DATA = JSON.parse(document.getElementById('data').textContent); }
 catch(err){
   document.getElementById('out').innerHTML =
     '<p class="none">The country data failed to load, so nothing can be shown.</p>';
   return;
 }
 var sel=document.getElementById('c'), out=document.getElementById('out');
 DATA.forEach(function(d,i){
   var o=document.createElement('option'); o.value=i; o.textContent=d.country; sel.appendChild(o);
 });
 var n=DATA.filter(function(d){return d.documented;}).length;
 document.getElementById('tally').textContent =
   DATA.length+' countries. '+n+' documented from the census questionnaire. '+
   'The rest are listed but not yet documented \u2014 no question text is shown for them.';

 function esc(s){return String(s).replace(/[&<>]/g,function(c){
   return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
 function tbl(l,a,b,interp){var h='<table><tr><th>'+a+'</th><th>'+b+'</th><th>English interpretation</th></tr>';
   l.forEach(function(r){var t=''; if(interp){for(var j=0;j<interp.length;j++){if(String(interp[j][0])===String(r[0])){t=interp[j][1];break;}}} h+='<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(t)+'</td></tr>';});
   return h+'</table>';}

 function render(i){
   var d=DATA[i], h='<h2>'+esc(d.country)+'</h2><dl>';
   h+='<dt>Year</dt><dd>'+esc(d.year)+'</dd>';
   if(!d.documented){
     h+='</dl><p class="q none">Not documented.</p>'+
        '<p class="note">No census questionnaire has been obtained for this country, '+
        'so no question text or response codes are recorded.</p>';
     if(d.notes) h+='<p class="note">'+esc(d.notes)+'</p>';
     if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}
   }
   h+='<dt>Form</dt><dd>'+esc(d.form)+'</dd>';
   h+='<dt>Question</dt><dd>'+esc(d.code)+'</dd>';
   h+='<dt>Source</dt><dd>'+esc(d.source)+'</dd></dl>';
   h+='<p class="q">'+esc(d.question)+'</p>';
   if(d.responses.length)       h+=tbl(d.responses,'Code','Response',d.response_interpretations);
   else if(d.respformat.length) h+=tbl(d.respformat,'Case','Recorded as',d.response_interpretations);
   if(d.skip)             h+='<p class="note">Skip: '+esc(d.skip)+'</p>';
   if(d.followups.length) h+=tbl(d.followups,'Code','Follow-up question');
   if(d.notes)            h+='<p class="note"><strong>Notes:</strong> '+esc(d.notes)+'</p>';
    if(d.verification)   h+='<p class="note"><strong>Source:</strong> '+esc(d.verification)+'</p>';
    if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}
   out.innerHTML=h;
 }
 sel.addEventListener('change',function(e){render(+e.target.value);});
 render(0);
})();
</script></body></html>
