<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Birthplace Questions by Country</title>
<style>
  body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222;
       max-width:720px;margin:0 auto;padding:24px}
  h1{font-size:22px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#555}
  select{font-size:15px;padding:5px;min-width:240px}
  h2{font-size:19px;margin:24px 0 4px}
  dl{margin:0 0 16px}
  dt{font-weight:bold;float:left;width:110px;clear:left}
  dd{margin:0 0 3px 110px}
  .q{font-size:17px;margin:16px 0}
  table{border-collapse:collapse;margin:0 0 16px}
  th,td{border:1px solid #999;padding:5px 10px;text-align:left;font-size:14px}
  th{background:#eee}
  .note{color:#555;margin:0 0 10px}
  .unver{color:#a33}
  hr{border:0;border-top:1px solid #ccc;margin:24px 0}
</style>
</head>
<body>
<h1>Birthplace Questions by Country</h1>
<p class="sub">2020 census round &mdash; Africa</p>

<label for="c">Country: </label>
<select id="c"></select>

<div id="out"></div>

<hr>
<p class="note" id="tally"></p>

<script>
const DATA = [{"country": "Algeria", "year": "2022", "form": "Questionnaire menage ordinaire et collectif (RGPH 2022)", "code": "207 (Volet 2 - Identification des membres du menage)", "source": "Verified from PDF - Office National des Statistiques (ONS)", "question": "Lieu de naissance [Arabic: makan al-milad]", "responses": [], "followups": [], "skip": "", "notes": "Geographic level: wilaya (province) and commune for domestic births; country for foreign births. Recorded as free text plus coded boxes rather than fixed categories, so there is no code list on the instrument itself. Distinct from Q214 (lieu de residence en Avril 2008), Q217 (dernier pays de residence a l'etranger) and Q213 (nationalite), which are migration and citizenship items.", "respformat": [["Type", "Write-in with numeric code boxes (no pre-coded categories)"], ["Born in Algeria", "Inscrire le nom de la wilaya et de la commune"], ["Born abroad", "Si la personne est nee a l'etranger, inscrire le nom du pays"]], "verified": true}, {"country": "Botswana", "year": "2022 (form branded \"2021 Population & Housing Census\")", "form": "Household Questionnaire", "code": "A10 (follow-ups A10a, A10c, A10d)", "source": "Verified from PDF - Statistics Botswana household questionnaire", "question": "When (A01_NAME) was born, where was the mother's usual place of residence?", "responses": [["1", "In Botswana"], ["2", "Outside Botswana"], ["3", "Deffer [sic - as printed on form]"]], "followups": [["A10a", "What was the usual place (district) of residence for (A01_NAME)'s mother? - SEE LIST PROVIDED"], ["A10c", "What was the usual place (locality) of residence for (A01_NAME)'s mother? - SEE LIST PROVIDED; GO TO A11"], ["A10d", "What was the usual place (country) of residence for (A01_NAME)'s mother? - SEE LIST PROVIDED"]], "skip": "IF 2 GO TO A10d", "notes": "Botswana does not ask place of birth directly. The instrument uses the mother's usual residence at the time of birth as the proxy, resolved to district, locality or country. Distinct from A11-A13 (place of usual living now / 1 year ago / 5 years ago) and from A07 (country of citizenship).", "respformat": [], "verified": true}, {"country": "Burkina Faso", "year": "2019", "form": "Household Questionnaire", "code": "Standard IPUMS item", "source": "IPUMS standard format", "question": "Quel est le lieu de naissance de (NAME)? [What is the birthplace of (NAME)?]", "responses": [["1", "In this region"], ["2", "In another region of Burkina Faso"], ["3", "Outside Burkina Faso"]], "followups": [], "skip": "", "notes": "French form; standard geographic birthplace hierarchy", "respformat": [], "verified": false}, {"country": "Burundi", "year": "2024", "form": "Household Questionnaire", "code": "Standard item", "source": "Digital census (Survey123)", "question": "Où est né(e) (NAME)? [Where was (NAME) born?]", "responses": [["1", "In this province"], ["2", "In another province of Burundi"], ["3", "Outside Burundi"]], "followups": [], "skip": "", "notes": "Part of core demographic section", "respformat": [], "verified": false}, {"country": "Cape Verde", "year": "2021", "form": "Enumeration Form (IPUMS)", "code": "Standard IPUMS item", "source": "IPUMS enumeration form", "question": "Onde nasceu (NAME)? [Where was (NAME) born?]", "responses": [["1", "In Cape Verde"], ["2", "Outside Cape Verde"]], "followups": [], "skip": "", "notes": "Portuguese form; simple binary response", "respformat": [], "verified": false}, {"country": "Comoros", "year": "2017", "form": "Enumeration Form (IPUMS)", "code": "BPLAC - Birth place category", "source": "IPUMS enumeration form", "question": "Où est né(e) (NAME)? [Where was (NAME) born?]", "responses": [["1", "In Comoros"], ["2", "Outside Comoros"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Standard IPUMS coded item", "respformat": [], "verified": false}, {"country": "Congo", "year": "2023", "form": "Household Questionnaire (RGPH-5)", "code": "D2", "source": "RGPH-5 standard format", "question": "Où (NAME) est-il/elle né(e)? [Where was (NAME) born?]", "responses": [["1", "In this department"], ["2", "In another department of Congo"], ["3", "Outside Congo"], ["8", "Unknown"]], "followups": [], "skip": "", "notes": "Administrative hierarchy: department level", "respformat": [], "verified": false}, {"country": "Egypt", "year": "2017", "form": "Household Questionnaire", "code": "BPLAC", "source": "IPUMS standard coding", "question": "What is the birthplace of (NAME)?", "responses": [["1", "In this governorate"], ["2", "In another governorate of Egypt"], ["3", "Outside Egypt"]], "followups": [], "skip": "", "notes": "Three-level hierarchy by administrative division", "respformat": [], "verified": false}, {"country": "Ghana", "year": "2021", "form": "Enumeration Form (IPUMS)", "code": "Standard IPUMS item", "source": "IPUMS enumeration form", "question": "Where was (NAME) born?", "responses": [["1", "In this locality"], ["2", "Elsewhere in Ghana"], ["3", "Outside Ghana"], ["9", "Don't know"]], "followups": [], "skip": "", "notes": "Locality-level geographic hierarchy", "respformat": [], "verified": false}, {"country": "Kenya", "year": "2019", "form": "Enumeration Form (IPUMS)", "code": "BPLAC", "source": "IPUMS enumeration form", "question": "Where was (NAME) born?", "responses": [["1", "In this county"], ["2", "In another county of Kenya"], ["3", "Outside Kenya"], ["9", "Don't know"]], "followups": [], "skip": "", "notes": "County-level administrative division", "respformat": [], "verified": false}, {"country": "Lesotho", "year": "2016", "form": "Household Questionnaire", "code": "Standard item", "source": "Household enumeration form", "question": "Where was (NAME) born?", "responses": [["1", "In this district"], ["2", "In another district of Lesotho"], ["3", "Outside Lesotho"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "District-based geographic coding", "respformat": [], "verified": false}, {"country": "Madagascar", "year": "2018", "form": "Enumeration Form (IPUMS)", "code": "Standard IPUMS item", "source": "IPUMS enumeration form", "question": "Où est né(e) (NAME)? [Where was (NAME) born?]", "responses": [["1", "In this region"], ["2", "In another region of Madagascar"], ["3", "Outside Madagascar"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Regional-level administrative division", "respformat": [], "verified": false}, {"country": "Malawi", "year": "2018", "form": "Enumeration Form (IPUMS)", "code": "BPLAC", "source": "IPUMS enumeration form", "question": "Where was (NAME) born?", "responses": [["1", "In this district"], ["2", "In another district of Malawi"], ["3", "Outside Malawi"], ["9", "Don't know"]], "followups": [], "skip": "", "notes": "District-level geographic hierarchy", "respformat": [], "verified": false}, {"country": "Mali", "year": "2022", "form": "Household Questionnaire (RGPH-5)", "code": "D2", "source": "RGPH-5 format", "question": "Où (NAME) est-il/elle né(e)? [Where was (NAME) born?]", "responses": [["1", "In this region"], ["2", "In another region of Mali"], ["3", "Outside Mali"], ["8", "Unknown"]], "followups": [], "skip": "", "notes": "Regional administrative level; multi-mode (CAPI + paper)", "respformat": [], "verified": false}, {"country": "Mauritius", "year": "2022", "form": "Enumeration Form (IPUMS)", "code": "Standard IPUMS item", "source": "IPUMS enumeration form", "question": "Where was (NAME) born?", "responses": [["1", "In Mauritius"], ["2", "Outside Mauritius"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Binary birthplace coding (in/out of country)", "respformat": [], "verified": false}, {"country": "Mayotte", "year": "Rolling (2016-2024)", "form": "Individual and Household Forms (INSEE)", "code": "V21, V22", "source": "INSEE rolling census format", "question": "Commune de naissance et pays de naissance [Birthplace commune and country]", "responses": [["Variable", "Specific commune code for Mayotte births"], ["Variable", "Country codes for births outside Mayotte"]], "followups": [], "skip": "", "notes": "More detailed: commune for domestic, country for international", "respformat": [], "verified": false}, {"country": "Morocco", "year": "2024", "form": "Census Question List", "code": "Standard item", "source": "Census question list", "question": "Lieu de naissance (province, commune, pays) [Place of birth: province, commune, country]", "responses": [["1", "In this province"], ["2", "In another province of Morocco"], ["3", "Outside Morocco"]], "followups": [], "skip": "", "notes": "Three-level administrative coding", "respformat": [], "verified": false}, {"country": "Mozambique", "year": "2017", "form": "Enumeration Form (IPUMS)", "code": "BPLAC", "source": "IPUMS enumeration form", "question": "Onde nasceu (NAME)? [Where was (NAME) born?]", "responses": [["1", "In this province"], ["2", "In another province of Mozambique"], ["3", "Outside Mozambique"]], "followups": [], "skip": "", "notes": "Portuguese form; province-level hierarchy", "respformat": [], "verified": false}, {"country": "Namibia", "year": "2023", "form": "Household Questionnaire (Form A)", "code": "Section B - Demographics", "source": "Digital census form", "question": "Where was (NAME) born?", "responses": [["1", "In this region"], ["2", "In another region of Namibia"], ["3", "Outside Namibia"], ["9", "Not stated"]], "followups": [], "skip": "", "notes": "Region-based geographic division; multi-mode collection", "respformat": [], "verified": false}, {"country": "Rwanda", "year": "2022", "form": "Household Questionnaire", "code": "Standard demographic item", "source": "Census form structure", "question": "What is the birthplace of (NAME)?", "responses": [["1", "In this district"], ["2", "In another district of Rwanda"], ["3", "Outside Rwanda"], ["8", "Prefer not to say"]], "followups": [], "skip": "", "notes": "District-level administrative hierarchy", "respformat": [], "verified": false}, {"country": "Saint Helena", "year": "2021 (also 2016)", "form": "Household Questionnaire", "code": "Demographics section", "source": "Household form", "question": "Where was (NAME) born?", "responses": [["1", "In Saint Helena"], ["2", "Outside Saint Helena"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Simple binary with 'Unknown' option", "respformat": [], "verified": false}, {"country": "Senegal", "year": "2023", "form": "Household Questionnaire (RGPH-5)", "code": "D2", "source": "RGPH-5 format", "question": "Où (NAME) est-il/elle né(e)? [Where was (NAME) born?]", "responses": [["1", "In this region"], ["2", "In another region of Senegal"], ["3", "Outside Senegal"], ["8", "Unknown"]], "followups": [], "skip": "", "notes": "Regional administrative level", "respformat": [], "verified": false}, {"country": "Seychelles", "year": "2022", "form": "Household Questionnaire (Digital Census)", "code": "Section A - Personal particulars", "source": "Digital census CAPI form", "question": "Where was (NAME) born?", "responses": [["1", "In Seychelles"], ["2", "Outside Seychelles"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Island nation: binary in/out coding", "respformat": [], "verified": false}, {"country": "Sierra Leone", "year": "2021", "form": "Midterm Household Questionnaire", "code": "Demographic items", "source": "Digital midterm census", "question": "Where was (NAME) born?", "responses": [["1", "In this district"], ["2", "In another district of Sierra Leone"], ["3", "Outside Sierra Leone"], ["9", "Don't know"]], "followups": [], "skip": "", "notes": "District-level administrative division", "respformat": [], "verified": false}, {"country": "South Africa", "year": "2022", "form": "Household Form (Digital)", "code": "Section A - Demographics", "source": "Fully digital census form", "question": "Where was (NAME) born?", "responses": [["1", "In South Africa"], ["2", "Outside South Africa"]], "followups": [], "skip": "", "notes": "Simple binary; country-level only", "respformat": [], "verified": false}, {"country": "Tanzania", "year": "2022", "form": "Household Questionnaire", "code": "Section B - Demographic items", "source": "IPUMS standard format", "question": "Where was (NAME) born?", "responses": [["1", "In this district"], ["2", "In another district of Tanzania"], ["3", "Outside Tanzania"], ["9", "Not stated"]], "followups": [], "skip": "", "notes": "District-based geographic hierarchy", "respformat": [], "verified": false}, {"country": "Uganda", "year": "2024", "form": "Household Questionnaire (Digital)", "code": "Section B - Demographic characteristics", "source": "Digital census (CSPro/tablets)", "question": "Where was (NAME) born?", "responses": [["1", "In this district"], ["2", "In another district in Uganda"], ["3", "In another country"]], "followups": [], "skip": "", "notes": "District-level administrative coding; first fully digital census", "respformat": [], "verified": false}, {"country": "Zambia", "year": "2022", "form": "Household Questionnaire", "code": "Demographic section", "source": "Digital census form", "question": "Where was (NAME) born?", "responses": [["1", "In this province"], ["2", "In another province of Zambia"], ["3", "Outside Zambia"], ["9", "Unknown"]], "followups": [], "skip": "", "notes": "Province-level administrative division", "respformat": [], "verified": false}, {"country": "Zimbabwe", "year": "2022", "form": "Household Questionnaire (Digital)", "code": "Section A - Demographic particulars", "source": "Digital census CAPI form", "question": "Where was (NAME) born?", "responses": [["1", "In this province"], ["2", "In another province of Zimbabwe"], ["3", "Outside Zimbabwe"], ["9", "Not stated"]], "followups": [], "skip": "", "notes": "Province-level geographic hierarchy; first digital census", "respformat": [], "verified": false}];
const sel = document.getElementById('c');
const out = document.getElementById('out');

DATA.forEach((d,i)=>{
  const o = document.createElement('option');
  o.value = i; o.textContent = d.country;
  sel.appendChild(o);
});
document.getElementById('tally').textContent =
  DATA.length + ' countries. ' + DATA.filter(d=>d.verified).length +
  ' verified against the questionnaire itself; the rest compiled from secondary sources.';

const esc = s => String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function rows(list, h1, h2){
  let h = '<table><tr><th>'+h1+'</th><th>'+h2+'</th></tr>';
  list.forEach(r=>{ h += '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td></tr>'; });
  return h + '</table>';
}

function render(i){
  const d = DATA[i];
  let h = '<h2>' + esc(d.country) + '</h2><dl>';
  h += '<dt>Year</dt><dd>' + esc(d.year) + '</dd>';
  h += '<dt>Form</dt><dd>' + esc(d.form) + '</dd>';
  h += '<dt>Question</dt><dd>' + esc(d.code) + '</dd>';
  h += '<dt>Source</dt><dd>' + esc(d.source) +
       (d.verified ? '' : ' <span class="unver">(not verified against the instrument)</span>') +
       '</dd></dl>';

  h += '<p class="q">' + esc(d.question || '\u2014') + '</p>';

  if(d.responses.length)       h += rows(d.responses, 'Code', 'Response');
  else if(d.respformat.length) h += rows(d.respformat, 'Case', 'Recorded as');

  if(d.skip)             h += '<p class="note">Skip: ' + esc(d.skip) + '</p>';
  if(d.followups.length) h += rows(d.followups, 'Code', 'Follow-up question');
  if(d.notes)            h += '<p class="note">' + esc(d.notes) + '</p>';

  out.innerHTML = h;
}

sel.addEventListener('change', e => render(+e.target.value));
render(0);
</script>
</body>
</html>
