ns", "Write ethnicity code."], ["For non-Kenyans", "Write code for nationality."]], "interpretations": [["For Kenyans", "Record the ethnicity code."], ["For non-Kenyans", "Record the nationality code."]], "followups": [], "skip": "", "notes": "The question explicitly uses the term \u201cethnicity.\u201d The form directs enumerators to record an ethnicity code for Kenyans and a nationality code for non-Kenyans.", "country": "Kenya", "source_links": [{"label": "Kenya_2019_enumeration_form_IPUMS_EN.pdf", "href": "../Kenya/Kenya_2019_enumeration_form_IPUMS_EN.pdf"}]}, {"status": "Yes", "year": "2022", "form": "Household questionnaire", "code": "P09C (with P09B ethnicity codes)", "source": "Mali_2022_household_fr.pdf", "question": "Quelle est l'ethnie de [NOM] ?", "responses": [["01", "Bamanan/Bambara"], ["02", "Malinke/Malink\u00e9"], ["03", "Peulh"], ["04", "Songhay/Sonrhai/Zarma"], ["05", "Soninke\u0301/Sarakole\u0301"], ["06", "Khassonke/Khassonke\u0301"], ["07", "Senoufo"], ["08", "Dogon"], ["09", "Souraka/Maure"], ["10", "Tamasheq/Touareg"], ["11", "Bo/Bwa/Bobo"], ["12", "Dafing"], ["13", "Mamala/Minianka"], ["14", "Haoussa"], ["15", "Samogo"], ["16", "Bozo"], ["17", "Arabe"], ["18", "Mossi"], ["19", "Kakolo"], ["20", "Somono"], ["21", "Autre \u00e9thnie du Mali"], ["22", "Autre ethnie non malienne"]], "interpretations": [["01", "Bamanan/Bambara"], ["02", "Malinke/Malink\u00e9"], ["03", "Peulh"], ["04", "Songhay/Sonrhai/Zarma"], ["05", "Soninke\u0301/Sarakole\u0301"], ["06", "Khassonke/Khassonke\u0301"], ["07", "Senoufo"], ["08", "Dogon"], ["09", "Souraka/Maure"], ["10", "Tamasheq/Touareg"], ["11", "Bo/Bwa/Bobo"], ["12", "Dafing"], ["13", "Mamala/Minianka"], ["14", "Haoussa"], ["15", "Samogo"], ["16", "Bozo"], ["17", "Arab"], ["18", "Mossi"], ["19", "Kakolo"], ["20", "Somono"], ["21", "Other ethnicity of Mali"], ["22", "Other non-Malian ethnicity"]], "followups": [], "skip": "", "notes": "P09C explicitly asks for ethnicity. The response categories are supplied in P09B. The questionnaire directs the respondent to P10 after the ethnicity question.", "country": "Mali", "source_links": [{"label": "Mali_2022_household_fr.pdf", "href": "../Mali/Mali_2022_household_fr.pdf"}]}, {"status": "Yes", "year": "2023", "form": "Household questionnaire", "code": "B18", "source": "Senegal_Household_2023_FR.pdf", "question": "Quelle est l'\u00e9thnie de [NOM] ?", "responses": [["Coded response list", "Choisir la r\u00e9ponse correspondante"]], "interpretations": [["Coded response list", "Choose the corresponding response."]], "followups": [], "skip": "If B18 = 00, go to B20.", "notes": "B18 explicitly asks for the person's ethnicity. The questionnaire provides a coded list of ethnicities and instructs the enumerator to choose the corresponding response.", "country": "Senegal", "source_links": [{"label": "Senegal_Household_2023_FR.pdf", "href": "../Senegal/Senegal_Household_2023_FR.pdf"}]}, {"status": "Yes", "year": "2021", "form": "Mid-Term Population and Housing Census Household Questionnaire", "code": "P09", "source": "Sierra_Leone_2021_midterm_household_questionnaire_EN.pdf", "question": "Write the Code of Ethnic Group.", "responses": [["Ethnic Group", "Use Code List."]], "interpretations": [["Ethnic Group", "Record the ethnic-group code using the code list."]], "followups": [["Non-Sierra Leonean", "Go to P10."]], "skip": "If Non-Sierra Leonean, Go to P10.", "notes": "P09 explicitly identifies the requested characteristic as \u201cEthnic Group\u201d and instructs the enumerator to write its code. No interpretation of tribe or another category is used here.", "country": "Sierra Leone", "source_links": [{"label": "Sierra_Leone_2021_midterm_household_questionnaire_EN.pdf", "href": "../Sierra_Leone/Sierra_Leone_2021_midterm_household_questionnaire_EN.pdf"}]}, {"status": "Yes", "year": "2022", "form": "2022 Census of Population and Housing Questionnaire", "code": "P20", "source": "zambia_2022-Census-Population-Housing-Qre_FV_5June2022-1.pdf", "question": "What is (NAME)'s ethnicity?", "responses": [["Write ethnicity name", "Record the ethnicity name and code."], ["No Zambian ethnicity", "Indicate country of origin."]], "interpretations": [["Write ethnicity name", "Enter the person's ethnicity name and record its code."], ["No Zambian ethnicity", "Indicate the country of origin."]], "followups": [], "skip": "", "notes": "P20 explicitly asks \u201cWhat is (NAME)'s ethnicity?\u201d The form instructs the enumerator to write the ethnicity name and record its code; for persons without Zambian ethnicity, it directs the enumerator to indicate the country of origin.", "country": "Zambia", "source_links": [{"label": "zambia_2022-Census-Population-Housing-Qre_FV_5June2022-1.pdf", "href": "../Zambia/zambia_2022-Census-Population-Housing-Qre_FV_5June2022-1.pdf"}]}]</script>
<script>
var data=JSON.parse(document.getElementById('data').textContent);
var sel=document.getElementById('c'), out=document.getElementById('out'), tally=document.getElementById('tally');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tbl(l,interp){
  var h='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';
  l.forEach(function(r,i){
    var en=(interp && interp[i]) ? interp[i][1] : '';
    h+='<tr><td>'+esc(r[1])+'</td><td>'+esc(en)+'</td></tr>';
  });
  return h+'</table>';
}
function render(i){
  var d=data[i], h='';
  var cls=d.status==='Yes'?'yes':(d.status==='No'?'none':'na');
  h+='<h2>'+esc(d.country)+'</h2>';
  h+='<dl><dt>Status</dt><dd class="'+cls+'"><strong>'+esc(d.status)+'</strong></dd>';
  h+='<dt>Year</dt><dd>'+esc(d.year)+'</dd>';
  h+='<dt>Form</dt><dd>'+esc(d.form)+'</dd>';
  if(d.code) h+='<dt>Question</dt><dd>'+esc(d.code)+'</dd>';
  h+='</dl>';
  h+='<div class="q">'+esc(d.question)+'</div>';
  if(d.responses.length) h+=tbl(d.responses,d.interpretations);
  if(d.followups.length){
    h+='<p><strong>Follow-ups:</strong></p><ul>';
    d.followups.forEach(function(r){h+='<li><strong>'+esc(r[0])+':</strong> '+esc(r[1])+'</li>';});
    h+='</ul>';
  }
  if(d.skip) h+='<p><strong>Skip:</strong> '+esc(d.skip)+'</p>';
  if(d.notes) h+='<p class="note"><strong>Notes:</strong> '+esc(d.notes)+'</p>';
  h+='<p class="note"><strong>Source:</strong> '+esc(d.verification)+'</p>';
  if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}out.innerHTML=h;
}
data.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=d.country;sel.appendChild(o);});
sel.addEventListener('change',function(){render(+this.value);});
var yes=data.filter(function(d){return d.status==='Yes';}).length;
var no=data.filter(function(d){return d.status==='No';}).length;
var na=data.filter(function(d){return d.status==='Not assessed';}).length;
tally.textContent=yes+' of '+data.length+' countries explicitly use ethnicity/ethnic group/ethnie in a question or question field; '+no+' do not have an explicit ethnicity term identified in the supplied source reviewed; '+na+' are not assessed because a source document was not available in the current conversation.';
render(0);
</script>
</body></html>
