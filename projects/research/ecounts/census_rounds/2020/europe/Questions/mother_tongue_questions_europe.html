<script>
const data=JSON.parse(document.getElementById('data').textContent),s=document.getElementById('c'),o=document.getElementById('out'),tally=document.getElementById('tally');

function show(i){let d=data[i],h=`<h2>${e(d.country)}</h2><dl><dt>Status</dt><dd>${e(d.status)}</dd><dt>Year</dt><dd>${e(d.year)}</dd><dt>Form/source</dt><dd>${e(d.form)}</dd><dt>Question</dt><dd>${e(d.code)}</dd></dl><div><strong>${e(d.question)}</strong></div>`;
if(d.responses?.length){h+='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';d.responses.forEach(r=>h+=`<tr><td>${e(r[0])}</td><td>${e(r[1])}</td></tr>`);h+='</table>';}
if(d.followups?.length){h+='<p><strong>Follow-ups:</strong></p><ul>';d.followups.forEach(r=>h+=`<li><strong>${e(r[0])}:</strong> ${e(r[1])}</li>`);h+='</ul>';}
if(d.skip)h+=`<p class="note"><b>Skip:</b> ${e(d.skip)}</p>`;if(d.notes)h+=`<p class="note"><b>Notes:</b> ${e(d.notes)}</p>`;h+=`<p class="source"><b>Source file(s):</b> ${e(d.source)}</p>`;
if(d.source_links&&d.source_links.length){h+='<p class="source"><b>Source:</b> ';d.source_links.forEach((l,i)=>{if(i)h+='; ';h+=`<a href="${e(l.href)}" target="_blank" rel="noopener">${e(l.label)}</a>`;});h+='</p>';}
o.innerHTML=h}
data.forEach((d,i)=>{let x=document.createElement('option');x.value=i;x.textContent=d.country;s.appendChild(x)});
s.onchange=()=>show(+s.value);
tally.textContent=data.length+' countries in this Europe batch explicitly ask a mother-tongue question, distinct from general language-ability or usual-spoken-language questions.';
show(0);
</script></body></html>
