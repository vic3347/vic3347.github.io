<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Race and Inequality</title>

  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { min-height: 100%; }

    body {
      min-height: 100vh;
      font-family: Georgia, 'Times New Roman', serif;
      color: #1a2340;
      background: #f5f8fd;
      position: relative;
    }

    /* Home link (upper right) */
    .home-link {
      position: fixed;
      top: 24px;
      right: 32px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.95em;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      text-decoration: none;
      color: #2d5fa6;
      padding-bottom: 3px;
      border-bottom: 2px solid transparent;
      transition: border-color 0.18s, color 0.18s;
      z-index: 1000;
    }

    .home-link:hover {
      color: #1a3d7a;
      border-bottom-color: #1a3d7a;
    }

    .page-wrap {
      max-width: 760px;
      margin: 0 auto;
      padding: 72px 40px 100px;
    }

    header {
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.6rem;
      font-weight: normal;
      letter-spacing: -0.02em;
      color: #0d1a33;
      border-bottom: 1.5px solid rgba(74, 127, 193, 0.3);
      padding-bottom: 16px;
    }

    /* === Research link section === */
    .research-block {
      position: relative;
      padding: 32px;
      margin-top: 30px;
      border-radius: 14px;
      overflow: hidden;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(20, 40, 80, 0.06);
    }

    /* Background image */
    .research-block::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: url("./shovelbum.png");
      background-repeat: no-repeat;
      background-position: right bottom;
      background-size: 260px;
      opacity: 0.10;
      pointer-events: none;
    }

    /* Light overlay so text stays readable */
    .research-block::after {
      content: "";
      position: absolute;
      inset: 0;
      background: #ffffff;
      opacity: 0.85;
    }

    .research-content {
      position: relative;
      z-index: 1;
    }

    .research-content h2 {
      margin-top: 0;
      font-size: 1.35rem;
      font-weight: normal;
      color: #0d1a33;
      margin-bottom: 6px;
    }

    .research-content .tag {
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.92rem;
      color: #5a7ba8;
      letter-spacing: 0.02em;
    }

    .research-content a {
      display: block;
      margin-top: 16px;
      padding: 16px 0;
      font-size: 1.15em;
      text-decoration: none;
      color: #2d5fa6;
      border-bottom: 1px solid rgba(74, 127, 193, 0.18);
      transition: padding-left 0.15s, color 0.15s;
    }

    .research-content a:last-of-type {
      border-bottom: none;
    }

    .research-content a:hover {
      padding-left: 10px;
      color: #1a3d7a;
    }

    /* Space reserved for future links */
    .future-space {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px dashed rgba(74, 127, 193, 0.3);
      color: #5a72a0;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      font-size: 0.92rem;
    }
  </style>
</head>

<body>

  <a class="home-link" href="/">Home</a>

  <div class="page-wrap">
    <header>
      <h1>Current Research</h1>
    </header>

    <div class="research-block">
      <div class="research-content">

        <a href="./pacoima/">
          Pacoima: Census, Neighborhood Change, and History
        </a>



      </div>
    </div>

  </div>

</body>
</html>
