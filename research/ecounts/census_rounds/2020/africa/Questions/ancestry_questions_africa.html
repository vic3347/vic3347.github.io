<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ancestry Questions by Country</title><style>body{font-family:Arial,Helvetica,sans-serif;font-size:15px;line-height:1.5;color:#222;max-width:720px;margin:0 auto;padding:24px}

<script id="data" type="application/json">[{"country": "Mauritius", "status": "Yes", "year": "2022", "form": "Individual questionnaire", "code": "R12; P10", "source": "Mauritius_2022_enumeration_form_IPUMS_EN.pdf", "question": "What is the language spoken by the person's ancestors? / Mauritian by descent", "responses": [["Ancestors", "What is the language spoken by the person's ancestors?"], ["Paternal and maternal ancestors", "If the language of the paternal ancestors is different from that of the maternal ancestors, write both."], ["Mauritian by descent", "Mauritian by descent."]], "interpretations": [["Ancestors", "What is the language spoken by the person's ancestors?"], ["Paternal and maternal ancestors", "If the paternal ancestors' language differs from the maternal ancestors' language, record both."], ["Mauritian by descent", "Mauritian by descent."]], "notes": "R12 explicitly asks about the language spoken by the person's ancestors. The form specifies that if the paternal and maternal ancestors' languages differ, both should be recorded. The same Mauritius census form also explicitly uses \u201cby descent\u201d as a citizenship category. Under the revised rule, explicit mentions of descent are included in this ancestry category.", "source_links": [{"label": "Mauritius_2022_enumeration_form_IPUMS_EN.pdf", "href": "../Mauritius/Mauritius_2022_enumeration_form_IPUMS_EN.pdf"}]}]</script><script>var data=JSON.parse(document.getElementById('data').textContent),sel=document.getElementById('c'),out=document.getElementById('out');
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function render(i){var d=data[i],h='',cls=d.status==='Yes'?'yes':(d.status==='No'?'none':'na');h+='<h2>'+esc(d.country)+'</h2><dl><dt>Status</dt><dd class="'+cls+'"><strong>'+esc(d.status)+'</strong></dd><dt>Year</dt><dd>'+esc(d.year)+'</dd><dt>Form</dt><dd>'+esc(d.form)+'</dd>';if(d.code)h+='<dt>Question</dt><dd>'+esc(d.code)+'</dd>';h+='</dl><div class="q">'+esc(d.question)+'</div>';h+='<p class="note"><strong>Notes:</strong> '+esc(d.notes)+'</p>';if(d.source_links&&d.source_links.length){h+='<p class="note"><strong>Source:</strong> ';d.source_links.forEach(function(s,i){if(i)h+='; ';h+='<a href="'+esc(s.href)+'" target="_blank" rel="noopener">'+esc(s.label)+'</a>';});h+='</p>';}out.innerHTML=h;}
data.forEach(function(d,i){var o=document.createElement('option');o.value=i;o.textContent=d.country;sel.appendChild(o);});sel.addEventListener('change',function(){render(+this.value);});render(0);</script></body></html>
