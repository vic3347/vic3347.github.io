n", "Pakistani, Scottish Pakistani or British Pakistani; Indian, Scottish Indian or British Indian; Bangladeshi, Scottish Bangladeshi or British Bangladeshi; Chinese, Scottish Chinese or British Chinese; Other (write in)."], ["D African, Scottish African or British African", "Write in, e.g. Nigerian or Somali."], ["E Caribbean or Black", "Write in, e.g. Scottish Caribbean or Black Scottish."], ["F Other ethnic group", "Arab, Scottish Arab or British Arab; Other (write in)."]], "interpretations": [["A White", "White classification."], ["B Mixed or multiple ethnic groups", "Mixed or multiple classification."], ["C Asian, Scottish Asian or British Asian", "Asian classification."], ["D African, Scottish African or British African", "African classification."], ["E Caribbean or Black", "Caribbean or Black classification."], ["F Other ethnic group", "Other classification."]], "followups": [], "skip": "", "notes": "RACE PAGE CROSS-REFERENCE: The census does NOT call this a race question. The official wording is 'What is your ethnic group?' It is included here because the response structure functions as a race/ethnic classification for comparative purposes. The same question remains on the Ethnicity page, where it is classified according to the source's terminology.", "source_links": [{"label": "UK_Scotland_2022_Household_questionnaire.pdf", "href": "../UK_Scotland/UK_Scotland_2022_Household_questionnaire.pdf"}, {"label": "UK_Scotland_2022_Individual_questionnaire.pdf", "href": "../UK_Scotland/UK_Scotland_2022_Individual_questionnaire.pdf"}, {"label": "UK_Scotland_2022_household_continuation_questionnaire.pdf", "href": "../UK_Scotland/UK_Scotland_2022_household_continuation_questionnaire.pdf"}, {"label": "UK_Scotland_2022_Large_print_household_questionnaire.pdf", "href": "../UK_Scotland/UK_Scotland_2022_Large_print_household_questionnaire.pdf"}]}, {"country": "United Kingdom (England & Wales)", "status": "Yes", "year": "2021", "form": "Census 2021 Household Questionnaire — specimen; England and Wales versions", "source": "UK_EW_2021_Household_England_EN.pdf; UK_EW_2021_Household_Wales_CY.pdf", "code": "Question 15", "question": "What is your ethnic group? Choose one section from A to E, then tick one box to best describe your ethnic group or background.", "responses": [["A White", "English, Welsh, Scottish, Northern Irish or British; Irish; Gypsy or Irish Traveller; Roma; Any other White background (write in)."], ["B Mixed or Multiple ethnic groups", "White and Black Caribbean; White and Black African; White and Asian; Any other Mixed or Multiple background (write in)."], ["C Asian or Asian British", "Indian; Pakistani; Bangladeshi; Chinese; Any other Asian background (write in)."], ["D Black, Black British, Caribbean or African", "Caribbean; African (write in background); Any other Black, Black British or Caribbean background (write in)."], ["E Other ethnic group", "Arab; Any other ethnic group (write in)."]], "interpretations": [["A White", "White classification."], ["B Mixed or Multiple ethnic groups", "Mixed or multiple classification."], ["C Asian or Asian British", "Asian classification."], ["D Black, Black British, Caribbean or African", "Black/Caribbean/African classification."], ["E Other ethnic group", "Other classification."]], "followups": [], "skip": "", "notes": "RACE PAGE CROSS-REFERENCE: The census does NOT call this a race question. The official wording is 'What is your ethnic group?' It is included here because the response structure functions as a race/ethnic classification for comparative purposes. The same question remains on the Ethnicity page, where it is classified according to the source's terminology.", "source_links": [{"label": "UK_EW_2021_Household_England_EN.pdf", "href": "../UK_England_Wales/UK_EW_2021_Household_England_EN.pdf"}, {"label": "UK_EW_2021_Household_Wales_CY.pdf", "href": "../UK_England_Wales/UK_EW_2021_Household_Wales_CY.pdf"}]}]</script>
<script>
const data=JSON.parse(document.getElementById('data').textContent),s=document.getElementById('c'),o=document.getElementById('out');
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function show(i){let d=data[i],h=`<h2>${e(d.country)}</h2><dl><dt>Status</dt><dd>${e(d.status)}</dd><dt>Year</dt><dd>${e(d.year)}</dd><dt>Form/source</dt><dd>${e(d.form)}</dd><dt>Question</dt><dd>${e(d.code)}</dd></dl><div class="q"><strong>${e(d.question)}</strong></div>`;
if(d.responses?.length){h+='<table><tr><th>Source response / wording</th><th>English interpretation</th></tr>';d.responses.forEach(r=>h+=`<tr><td>${e(r[0])}</td><td>${e(r[1])}</td></tr>`);h+='</table>';}
if(d.skip)h+=`<p class="note"><b>Skip:</b> ${e(d.skip)}</p>`;
if(d.notes)h+=`<p class="note"><b>Notes:</b> ${e(d.notes)}</p>`;
h+=`<p class="source"><b>Source file(s):</b> ${e(d.source)}</p>`;
if(d.source_links&&d.source_links.length){h+='<p class="source"><b>Source:</b> ';d.source_links.forEach((l,i)=>{if(i)h+='; ';h+=`<a href="${e(l.href)}" target="_blank" rel="noopener">${e(l.label)}</a>`;});h+='</p>';}
o.innerHTML=h}
data.forEach((d,i)=>{let x=document.createElement('option');x.value=i;x.textContent=d.country;s.appendChild(x)});s.onchange=()=>show(+s.value);show(0);
</script></main></body></html>
