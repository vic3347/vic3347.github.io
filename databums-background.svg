<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Base gradient: bright white to very light blue-grey -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="45%" style="stop-color:#f5f8fd;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#edf2fa;stop-opacity:1" />
    </linearGradient>

    <!-- Accent glow: warm amber, very soft -->
    <radialGradient id="glowAmber" cx="72%" cy="30%" r="38%">
      <stop offset="0%" style="stop-color:#d4884a;stop-opacity:0.06" />
      <stop offset="100%" style="stop-color:#d4884a;stop-opacity:0" />
    </radialGradient>

    <!-- Subtle blue glow lower-left -->
    <radialGradient id="glowBlue" cx="15%" cy="80%" r="32%">
      <stop offset="0%" style="stop-color:#3a6ec8;stop-opacity:0.05" />
      <stop offset="100%" style="stop-color:#3a6ec8;stop-opacity:0" />
    </radialGradient>

    <!-- Grid line fade -->
    <linearGradient id="gridFadeH" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a7fc1;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#4a7fc1;stop-opacity:0.18" />
      <stop offset="80%" style="stop-color:#4a7fc1;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#4a7fc1;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="gridFadeV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a7fc1;stop-opacity:0" />
      <stop offset="20%" style="stop-color:#4a7fc1;stop-opacity:0.18" />
      <stop offset="80%" style="stop-color:#4a7fc1;stop-opacity:0.18" />
      <stop offset="100%" style="stop-color:#4a7fc1;stop-opacity:0" />
    </linearGradient>

    <!-- Clip paths -->
    <clipPath id="svgClip">
      <rect width="1920" height="1080"/>
    </clipPath>

    <!-- Noise filter for texture -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noiseOut"/>
      <feColorMatrix type="saturate" values="0" in="noiseOut" result="grayNoise"/>
      <feBlend in="SourceGraphic" in2="grayNoise" mode="overlay" result="blended"/>
      <feComposite in="blended" in2="SourceGraphic" operator="in"/>
    </filter>

    <!-- Dot marker for scatter -->
    <symbol id="dot" viewBox="0 0 4 4">
      <circle cx="2" cy="2" r="1.5" fill="#c8d8f0" opacity="0.5"/>
    </symbol>
  </defs>

  <g clip-path="url(#svgClip)">

    <!-- ── Background ── -->
    <rect width="1920" height="1080" fill="url(#bgGrad)"/>
    <rect width="1920" height="1080" fill="url(#glowAmber)"/>
    <rect width="1920" height="1080" fill="url(#glowBlue)"/>

    <!-- ── Fine grid (60px cells) ── -->
    <g opacity="0.12">
      <!-- Horizontal lines -->
      <line x1="0" y1="60"  x2="1920" y2="60"  stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="120" x2="1920" y2="120" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="180" x2="1920" y2="180" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="240" x2="1920" y2="240" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="300" x2="1920" y2="300" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="360" x2="1920" y2="360" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="420" x2="1920" y2="420" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="480" x2="1920" y2="480" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="540" x2="1920" y2="540" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="600" x2="1920" y2="600" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="660" x2="1920" y2="660" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="720" x2="1920" y2="720" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="780" x2="1920" y2="780" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="840" x2="1920" y2="840" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="900" x2="1920" y2="900" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="960" x2="1920" y2="960" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="0" y1="1020" x2="1920" y2="1020" stroke="#8aafd0" stroke-width="0.5"/>
      <!-- Vertical lines -->
      <line x1="60"  y1="0" x2="60"  y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="120" y1="0" x2="120" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="180" y1="0" x2="180" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="240" y1="0" x2="240" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="300" y1="0" x2="300" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="360" y1="0" x2="360" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="420" y1="0" x2="420" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="480" y1="0" x2="480" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="540" y1="0" x2="540" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="600" y1="0" x2="600" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="660" y1="0" x2="660" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="720" y1="0" x2="720" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="780" y1="0" x2="780" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="840" y1="0" x2="840" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="900" y1="0" x2="900" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="960" y1="0" x2="960" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1020" y1="0" x2="1020" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1080" y1="0" x2="1080" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1140" y1="0" x2="1140" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1200" y1="0" x2="1200" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1260" y1="0" x2="1260" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1320" y1="0" x2="1320" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1380" y1="0" x2="1380" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1440" y1="0" x2="1440" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1500" y1="0" x2="1500" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1560" y1="0" x2="1560" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1620" y1="0" x2="1620" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1680" y1="0" x2="1680" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1740" y1="0" x2="1740" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1800" y1="0" x2="1800" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
      <line x1="1860" y1="0" x2="1860" y2="1080" stroke="#8aafd0" stroke-width="0.5"/>
    </g>

    <!-- ── Heavier 300px structural grid ── -->
    <g opacity="0.18" stroke="#6a9fc4" stroke-width="1">
      <line x1="0"    y1="300" x2="1920" y2="300"/>
      <line x1="0"    y1="600" x2="1920" y2="600"/>
      <line x1="0"    y1="900" x2="1920" y2="900"/>
      <line x1="300"  y1="0" x2="300"  y2="1080"/>
      <line x1="600"  y1="0" x2="600"  y2="1080"/>
      <line x1="900"  y1="0" x2="900"  y2="1080"/>
      <line x1="1200" y1="0" x2="1200" y2="1080"/>
      <line x1="1500" y1="0" x2="1500" y2="1080"/>
      <line x1="1800" y1="0" x2="1800" y2="1080"/>
    </g>

    <!-- ── Scatter plot: lower-left quadrant, race/inequality data cluster ── -->
    <g opacity="0.35">
      <!-- cluster 1: tighter grouping around 240,780 -->
      <circle cx="210" cy="800" r="2.5" fill="#3a72b0"/>
      <circle cx="228" cy="812" r="2"   fill="#3a72b0"/>
      <circle cx="245" cy="790" r="3"   fill="#3a72b0"/>
      <circle cx="263" cy="805" r="2"   fill="#5590c8"/>
      <circle cx="278" cy="818" r="2.5" fill="#3a72b0"/>
      <circle cx="255" cy="830" r="1.8" fill="#3a72b0"/>
      <circle cx="235" cy="845" r="2.2" fill="#5590c8"/>
      <circle cx="290" cy="795" r="2"   fill="#3a72b0"/>
      <circle cx="305" cy="812" r="3"   fill="#b86a28" opacity="0.8"/>
      <circle cx="320" cy="825" r="2"   fill="#3a72b0"/>
      <circle cx="270" cy="858" r="2.5" fill="#3a72b0"/>
      <circle cx="312" cy="840" r="1.8" fill="#5590c8"/>
      <circle cx="195" cy="775" r="2"   fill="#b86a28" opacity="0.8"/>
      <circle cx="340" cy="800" r="2.2" fill="#3a72b0"/>
      <circle cx="355" cy="818" r="2.8" fill="#3a72b0"/>
      <circle cx="180" cy="830" r="2"   fill="#3a72b0"/>
      <circle cx="168" cy="812" r="1.8" fill="#5590c8"/>
      <circle cx="330" cy="862" r="2"   fill="#3a72b0"/>
      <!-- cluster 2: upper portion of lower-left -->
      <circle cx="160" cy="710" r="2.2" fill="#3a72b0"/>
      <circle cx="195" cy="695" r="3"   fill="#b86a28" opacity="0.75"/>
      <circle cx="220" cy="718" r="2"   fill="#3a72b0"/>
      <circle cx="250" cy="702" r="2.5" fill="#3a72b0"/>
      <circle cx="278" cy="726" r="2"   fill="#5590c8"/>
      <circle cx="305" cy="712" r="2.8" fill="#3a72b0"/>
      <circle cx="335" cy="730" r="2"   fill="#3a72b0"/>
      <circle cx="360" cy="698" r="1.8" fill="#b86a28" opacity="0.75"/>
      <circle cx="175" cy="744" r="2.2" fill="#3a72b0"/>
      <circle cx="240" cy="752" r="2"   fill="#5590c8"/>
      <!-- outliers -->
      <circle cx="420" cy="920" r="2"   fill="#3a72b0"/>
      <circle cx="460" cy="900" r="1.8" fill="#b86a28" opacity="0.7"/>
      <circle cx="400" cy="860" r="2.5" fill="#3a72b0"/>
      <circle cx="380" cy="910" r="2"   fill="#3a72b0"/>
    </g>

    <!-- Trend line through scatter cluster -->
    <line x1="155" y1="875" x2="480" y2="670" stroke="#5a9fd4" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.4"/>

    <!-- ── Bar chart: right side, global enumeration evocation ── -->
    <g opacity="0.22" fill="#4a7fc1">
      <!-- bars anchored at y=980, ascending from right edge inward -->
      <rect x="1680" y="820" width="28" height="160" rx="2"/>
      <rect x="1716" y="760" width="28" height="220" rx="2"/>
      <rect x="1752" y="700" width="28" height="280" rx="2"/>
      <rect x="1788" y="730" width="28" height="250" rx="2"/>
      <rect x="1824" y="670" width="28" height="310" rx="2"/>
      <rect x="1860" y="710" width="28" height="270" rx="2"/>
      <!-- second smaller cluster -->
      <rect x="1560" y="860" width="22" height="120" rx="2" opacity="0.6"/>
      <rect x="1590" y="840" width="22" height="140" rx="2" opacity="0.6"/>
      <rect x="1620" y="890" width="22" height="90"  rx="2" opacity="0.6"/>
      <rect x="1650" y="830" width="22" height="150" rx="2" opacity="0.6"/>
    </g>
    <!-- Amber accent bars (highlight subset) -->
    <g opacity="0.35" fill="#c8803a">
      <rect x="1752" y="700" width="28" height="280" rx="2"/>
      <rect x="1824" y="670" width="28" height="310" rx="2"/>
    </g>

    <!-- ── Line chart: upper center, longitudinal data motif ── -->
    <g opacity="0.28">
      <!-- main trend line -->
      <polyline points="600,480 660,452 720,468 780,430 840,410 900,422 960,390 1020,375 1080,355 1140,342 1200,360 1260,330 1320,318"
                fill="none" stroke="#5a9fd4" stroke-width="1.8" stroke-linejoin="round"/>
      <!-- second series, slightly below -->
      <polyline points="600,530 660,520 720,540 780,510 840,525 900,505 960,490 1020,498 1080,480 1140,472 1200,488 1260,462 1320,450"
                fill="none" stroke="#d4884a" stroke-width="1.5" stroke-linejoin="round" stroke-dasharray="8,4"/>
      <!-- data points on primary line -->
      <circle cx="600"  cy="480" r="3" fill="#5a9fd4"/>
      <circle cx="720"  cy="468" r="3" fill="#5a9fd4"/>
      <circle cx="840"  cy="410" r="3" fill="#5a9fd4"/>
      <circle cx="960"  cy="390" r="3" fill="#5a9fd4"/>
      <circle cx="1080" cy="355" r="3" fill="#5a9fd4"/>
      <circle cx="1200" cy="360" r="3.5" fill="#c8803a"/>
      <circle cx="1320" cy="318" r="3" fill="#5a9fd4"/>
      <!-- axis lines -->
      <line x1="598" y1="300" x2="598" y2="580" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="598" y1="578" x2="1340" y2="578" stroke="#4a7fc1" stroke-width="0.8"/>
      <!-- tick marks x-axis -->
      <line x1="660"  y1="574" x2="660"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="720"  y1="574" x2="720"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="780"  y1="574" x2="780"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="840"  y1="574" x2="840"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="900"  y1="574" x2="900"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="960"  y1="574" x2="960"  y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1020" y1="574" x2="1020" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1080" y1="574" x2="1080" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1140" y1="574" x2="1140" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1200" y1="574" x2="1200" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1260" y1="574" x2="1260" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="1320" y1="574" x2="1320" y2="582" stroke="#4a7fc1" stroke-width="0.8"/>
      <!-- tick marks y-axis -->
      <line x1="594" y1="400" x2="602" y2="400" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="594" y1="450" x2="602" y2="450" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="594" y1="500" x2="602" y2="500" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="594" y1="550" x2="602" y2="550" stroke="#4a7fc1" stroke-width="0.8"/>
      <line x1="594" y1="350" x2="602" y2="350" stroke="#4a7fc1" stroke-width="0.8"/>
    </g>

    <!-- ── Data table ghost: upper right ── -->
    <g opacity="0.10" stroke="#6a9fd8" stroke-width="0.7" fill="none">
      <!-- table outline -->
      <rect x="1380" y="80" width="480" height="260" rx="2"/>
      <!-- header row -->
      <line x1="1380" y1="118" x2="1860" y2="118"/>
      <!-- row dividers -->
      <line x1="1380" y1="156" x2="1860" y2="156"/>
      <line x1="1380" y1="194" x2="1860" y2="194"/>
      <line x1="1380" y1="232" x2="1860" y2="232"/>
      <line x1="1380" y1="270" x2="1860" y2="270"/>
      <!-- column dividers -->
      <line x1="1500" y1="80" x2="1500" y2="340"/>
      <line x1="1620" y1="80" x2="1620" y2="340"/>
      <line x1="1740" y1="80" x2="1740" y2="340"/>
      <!-- faint cell fill: header -->
      <rect x="1380" y="80" width="480" height="38" fill="#4a7fc1" opacity="0.4" rx="2"/>
    </g>
    <!-- cell content dashes (suggests text rows) -->
    <g opacity="0.08" stroke="#6a9fd8" stroke-width="1.2">
      <line x1="1400" y1="138" x2="1478" y2="138"/>
      <line x1="1400" y1="176" x2="1478" y2="176"/>
      <line x1="1400" y1="214" x2="1478" y2="214"/>
      <line x1="1400" y1="252" x2="1478" y2="252"/>
      <line x1="1400" y1="290" x2="1478" y2="290"/>
      <line x1="1400" y1="316" x2="1440" y2="316"/>
      <line x1="1520" y1="138" x2="1598" y2="138"/>
      <line x1="1520" y1="176" x2="1598" y2="176"/>
      <line x1="1520" y1="214" x2="1570" y2="214"/>
      <line x1="1520" y1="252" x2="1598" y2="252"/>
      <line x1="1640" y1="138" x2="1718" y2="138"/>
      <line x1="1640" y1="176" x2="1700" y2="176"/>
      <line x1="1640" y1="214" x2="1718" y2="214"/>
      <line x1="1640" y1="252" x2="1680" y2="252"/>
      <line x1="1760" y1="138" x2="1838" y2="138"/>
      <line x1="1760" y1="176" x2="1838" y2="176"/>
      <line x1="1760" y1="214" x2="1810" y2="214"/>
      <line x1="1760" y1="252" x2="1838" y2="252"/>
    </g>

    <!-- ── Network / connection nodes: upper-left, social research motif ── -->
    <g opacity="0.20">
      <!-- edges first -->
      <line x1="120" y1="140" x2="240" y2="200" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="120" y1="140" x2="180" y2="260" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="240" y1="200" x2="360" y2="155" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="240" y1="200" x2="300" y2="290" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="180" y1="260" x2="300" y2="290" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="360" y1="155" x2="450" y2="210" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="300" y1="290" x2="420" y2="310" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="450" y1="210" x2="420" y2="310" stroke="#5a9fd4" stroke-width="0.8"/>
      <line x1="120" y1="140" x2="80"  y2="230" stroke="#5a9fd4" stroke-width="0.8" stroke-dasharray="4,3"/>
      <line x1="80"  y1="230" x2="180" y2="260" stroke="#5a9fd4" stroke-width="0.8" stroke-dasharray="4,3"/>
      <!-- nodes -->
      <circle cx="120" cy="140" r="6"  fill="#5a9fd4"/>
      <circle cx="240" cy="200" r="8"  fill="#5a9fd4"/>
      <circle cx="180" cy="260" r="5"  fill="#5a9fd4"/>
      <circle cx="360" cy="155" r="5.5" fill="#c8803a"/>
      <circle cx="300" cy="290" r="7"  fill="#5a9fd4"/>
      <circle cx="450" cy="210" r="4.5" fill="#5a9fd4"/>
      <circle cx="420" cy="310" r="6"  fill="#c8803a"/>
      <circle cx="80"  cy="230" r="4"  fill="#5a9fd4"/>
    </g>

    <!-- ── Very subtle vignette ── -->
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%"   style="stop-color:#e8edf5;stop-opacity:0"/>
      <stop offset="100%" style="stop-color:#dce4f0;stop-opacity:0.18"/>
    </radialGradient>
    <rect width="1920" height="1080" fill="url(#vignette)"/>

    <!-- ── Very faint film grain overlay ── -->
    <rect width="1920" height="1080" fill="url(#bgGrad)" opacity="0.03" filter="url(#noise)"/>

  </g>
</svg>
